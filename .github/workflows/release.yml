name: Release

# A cada tag vX.Y.Z: valida (roda os 105 checks sobre imagens sinteticas) e publica
# um Release com as notas dos commits desde a tag anterior. Sem passo manual.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest   # ferramenta Windows (acesso a \.\PhysicalDrive)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Os testes usam imagens de disco sinteticas — nao tocam hardware real.
      - name: Testes
        run: python -m tests.test_copiahd

      - name: Montar as notas dos commits
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then echo "## Mudanças desde ${PREV}" > NOTES.md; RANGE="${PREV}..${TAG}"; else echo "## Primeiro release" > NOTES.md; RANGE="${TAG}"; fi
          echo "" >> NOTES.md
          git log --no-merges --pretty='- %s' "$RANGE" >> NOTES.md

      - name: Publicar o Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file NOTES.md
